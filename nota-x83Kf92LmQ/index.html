<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para ti</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      max-width: 500px;
      background: white;
      padding: 2em;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.4em;
      margin-bottom: 0.5em;
    }
    p {
      line-height: 1.6;
      font-size: 1.05em;
    }
    .date {
      margin-top: 1.5em;
      font-size: 0.85em;
      color: #777;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hola ❤️</h1>

    <p>
      Hoy solo quería recordarte algo sencillo:  
      me gusta mucho compartir la vida contigo.
    </p>

    <p>
      A veces las cosas importantes no son grandes discursos,  
      sino estos pequeños momentos que vamos sumando.
    </p>

    <div class="date">
      Actualizado: febrero 2026
    </div>
  </div>
</body>
</html>
