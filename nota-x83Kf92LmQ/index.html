<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti amor❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f2f3f5, #e6e8eb);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2b2b2b;
    }

    .card {
      background: #ffffff;
      padding: 2.8rem 2.4rem;
      border-radius: 22px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-top: 0;
      font-size: 1.9rem;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.7;
      margin: 1.4rem 0 0;
      color: #3a3a3a;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #888;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Hola, amor ❤️</h1>
    <p id="message"></p>
    <div class="footer">De tu Ardillita 🐿️</div>
  </div>

  <script>
    // ✏️ CAMBIA AQUÍ EL MENSAJE CUANDO QUIERAS
    const mensajeActual = "Solo quería recordarte lo mucho que te amo y lo importante que eres para mí 💕";

    // Si algún día quieres usar varios mensajes:
    // const mensajes = ["Mensaje 1", "Mensaje 2", "Mensaje 3"];
    // const mensajeActual = mensajes[Math.floor(Math.random() * mensajes.length)];

    document.getElementById('message').textContent = mensajeActual;
  </script>
</body>
