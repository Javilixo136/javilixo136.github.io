<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eaeaea;
    }

    .card {
      background: #121212;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #eaeaea;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 1.2rem 0 0;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #777;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Hola, amor ❤️</h1>
    <p id="message"></p>
    <div class="footer">Escaneado con amor ✨</div>
  </div>

  <script>
    // ✏️ CAMBIA AQUÍ EL MENSAJE CUANDO QUIERAS
    const mensajeActual = "Hoy solo quería recordarte lo mucho que te quiero y lo importante que eres para mí 💕";

    // Si algún día quieres usar varios mensajes:
    // const mensajes = ["Mensaje 1", "Mensaje 2", "Mensaje 3"];
    // const mensajeActual = mensajes[Math.floor(Math.random() * mensajes.length)];

    document.getElementById('message').textContent = mensajeActual;
  </script>
</body>
</html>
