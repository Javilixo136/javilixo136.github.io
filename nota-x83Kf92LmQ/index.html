<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f2f3f5, #e6e8eb);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2b2b2b;
    }

    .card {
      background: #ffffff;
      padding: 3rem 2.6rem;
      border-radius: 22px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
      animation: fadeIn 1.2s ease;
    }

    h1 {
      margin: 0 0 1.4rem;
      font-size: 1.9rem;
      font-weight: 600;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.8;
      margin: 0;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #888;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hola, amor ❤️</h1>
    <p>
      Solo quería recordarte lo mucho que te amo  
      y lo importante que eres para mí 💕
    </p>
    <div class="footer">De tu Ardillita 🐿️</div>
  </div>
</body>
</html>
