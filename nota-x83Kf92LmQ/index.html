<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f7f8fa, #e4e6ea);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2b2b2b;
    }

    .card {
      background: #ffffff;
      padding: 3.2rem 2.8rem;
      border-radius: 24px;
      max-width: 420px;
      text-align: center;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      animation: appear 1.4s ease;
    }

    h1 {
      margin: 0 0 1.6rem;
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.85;
      margin: 0;
    }

    .footer {
      margin-top: 2.4rem;
      font-size: 0.85rem;
      color: #9a9a9a;
      letter-spacing: 0.3px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hola, amor ❤️</h1>
    <p>
      ¿Como séque te quiero? 
      Simplemente recuerdo 
      la emoción que siento cuando te veo 
      y la sensación de calma 
      cuando estas conmigo.❤️
    </p>
    <div class="footer">De tu Ardillita 🐿️</div>
  </div>
</body>
</html>
